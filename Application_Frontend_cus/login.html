```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | AutoParts</title>

  <link rel="stylesheet" href="css/customer-shop.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0d0d0d;

      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 390px;
      background: #ffffff;
      padding: 38px;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-card h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #222;
      font-size: 32px;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .register-link {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .register-link a {
      color: #ef3d38;
      font-weight: 700;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #222;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #ef3d38;
      box-shadow: 0 0 0 2px rgba(239, 61, 56, 0.1);
    }

    .login-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 4px;
      background: #ef3d38;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #d9322e;
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .login-message {
      min-height: 18px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .login-message.error {
      color: #d62828;
    }

    .login-message.success {
      color: #0a9a62;
    }
  </style>
</head>

<body>

<div class="login-card">

  <h1>AutoParts Login</h1>

  <p class="login-subtitle">
    Login to continue
  </p>

  <p class="register-link">
    Don't have an account?
    <a href="register.html">Register Now</a>
  </p>

  <form id="loginForm">

    <div class="form-group">
      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        autocomplete="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >
    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginButton"
    >
      LOGIN
    </button>

    <div
      id="loginMessage"
      class="login-message"
    ></div>

  </form>

</div>


<script>
  const form =
    document.getElementById("loginForm");

  const message =
    document.getElementById("loginMessage");

  const loginButton =
    document.getElementById("loginButton");


  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    message.className = "login-message";
    message.textContent = "Logging in...";

    loginButton.disabled = true;


    try {

      const response = await fetch(
        "http://localhost:8080/api/user/login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            username: username,
            password: password
          })
        }
      );

      const result = await response.json();

      console.log("LOGIN RESPONSE:", result);


      if (!response.ok || !result.data) {

        message.className =
          "login-message error";

        message.textContent =
          result.message ||
          "Invalid username or password";

        loginButton.disabled = false;

        return;
      }


      const user = result.data;

      localStorage.setItem(
        "loggedUser",
        JSON.stringify(user)
      );


      const role = String(
        user.userRole || ""
      )
        .trim()
        .toLowerCase();

      console.log("ROLE:", role);


      if (role === "admin") {

        window.location.href =
          "http://localhost:63342/final/SE_project/Application_Frontend/index.html";

      } else if (role === "customer") {

        window.location.href =
          "http://localhost:63342/final/SE_project/Application_Frontend_cus/index.html";
      } else {

        localStorage.removeItem("loggedUser");

        message.className =
          "login-message error";

        message.textContent =
          "This user role is not supported.";

        loginButton.disabled = false;
      }


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      message.className =
        "login-message error";

      message.textContent =
        "Cannot connect to server.";

      loginButton.disabled = false;
    }

  });
</script>

</body>
</html>
