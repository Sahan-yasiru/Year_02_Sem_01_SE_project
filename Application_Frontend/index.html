<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AutoParts Admin — Vision UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

    <!-- Toast Notification Overlay Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Application Wrapper -->
    <div class="app-wrapper">

        <!-- ═══ SIDEBAR ═══════════════════════════════════════ -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">A</div>
                <div class="logo-text">
                    AutoParts
                    <span>Vision Glass Admin</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section-label">Main</div>

                <button class="sidebar-link active" data-page="customers" data-title="Customers" onclick="navigate('customers','Customers')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/>
                    </svg>
                    <span>Customers</span>
                </button>

                <button class="sidebar-link" data-page="supplier" data-title="Suppliers" onclick="navigate('supplier','Suppliers')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25"/>
                    </svg>
                    <span>Suppliers</span>
                </button>

                <button class="sidebar-link" data-page="users" data-title="User Management" onclick="navigate('users','User Management')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                    </svg>
                    <span>Users</span>
                </button>

                <div class="sidebar-section-label">Orders</div>

                <button class="sidebar-link" data-page="orders" data-title="Orders" onclick="navigate('orders','Orders')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/>
                    </svg>
                    <span>Orders</span>
                </button>

                <button class="sidebar-link" data-page="customer-returns" data-title="Customer Returns" onclick="navigate('customer-returns','Customer Returns')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/>
                    </svg>
                    <span>Customer Returns</span>
                </button>

                <div class="sidebar-section-label">Inventory &amp; Catalog</div>

                <button class="sidebar-link" data-page="brand" data-title="Brand Management" onclick="navigate('brand','Brand Management')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z"/>
                    </svg>
                    <span>Brands</span>
                </button>

                <button class="sidebar-link" data-page="category" data-title="Category Management" onclick="navigate('category','Category Management')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/>
                    </svg>
                    <span>Categories</span>
                </button>

                <button class="sidebar-link" data-page="spare-parts" data-title="Spare Parts" onclick="navigate('spare-parts','Spare Parts')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008z"/>
                    </svg>
                    <span>Spare Parts</span>
                </button>

                <button class="sidebar-link" data-page="inventory" data-title="Inventory Management" onclick="navigate('inventory','Inventory Management')">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/>
                    </svg>
                    <span>Inventory</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="user-avatar-sm">A</div>
                <div class="user-info">
                    <span class="user-name">System Admin</span>
                    <span class="user-role">Administrator</span>
                </div>
            </div>
        </aside>

        <!-- ═══ MAIN CONTENT AREA ════════════════════════════ -->
        <div class="main-content-wrapper">

            <!-- Navbar -->
            <header class="navbar">
                <div class="navbar-left">
                    <button id="hamburger-btn" class="hamburger-btn" aria-label="Toggle navigation">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                        </svg>
                    </button>
                    <div>
                        <div id="nav-page-title" class="navbar-title">Customers</div>
                        <div class="breadcrumb">
                            <span>AutoParts</span>
                            <span>/</span>
                            <span id="nav-page-breadcrumb">Management</span>
                        </div>
                    </div>
                </div>

                <div class="navbar-right">
                    <div class="backend-status-pill">
                        <span class="status-dot online"></span>
                        <span>API Connected</span>
                    </div>
                    <div class="user-avatar-sm" style="box-shadow:none;">A</div>
                </div>
            </header>

            <!-- Dynamic Partial Content Container -->
            <main id="main-content" class="main-content">
                <div style="display:flex;align-items:center;justify-content:center;min-height:300px;">
                    <div class="spinner-sm" style="width:36px;height:36px;border-width:3px;"></div>
                </div>
            </main>

        </div><!-- /main-content-wrapper -->

    </div><!-- /app-wrapper -->

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/supplier.js"></script>
    <script src="js/brand.js"></script>
    <script src="js/category.js"></script>
    <script src="js/spare-parts.js"></script>
    <script src="js/users.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/customer-returns.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
